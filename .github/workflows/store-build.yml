# Builds the Play Store (.aab) and/or App Store (.ipa) version of the app on
# Expo's servers (EAS), and can send it straight to the stores.
# Needs one GitHub secret: EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# iPhone builds need the Apple Developer account linked once (see apps/mobile/STORE-RELEASE.md).
name: Store build (Play Store / App Store)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android, ios or all"
        required: true
        default: android
        type: choice
        options: [android, ios, all]
      submit:
        description: "Send the build to the store after it finishes"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Build on EAS
        working-directory: apps/mobile
        run: >
          eas build --platform ${{ inputs.platform }} --profile production --non-interactive --no-wait
          ${{ inputs.submit && '--auto-submit' || '' }}
